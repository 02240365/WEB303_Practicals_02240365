syntax = "proto3";

package customer;

option go_package = "ecommerce-microservices/proto";

// CustomerService stores basic customer profile information and lets
// other services (e.g. Order Service) verify a customer before an
// order is processed.
service CustomerService {
  // GetCustomer returns a customer's profile by ID.
  // Returns INVALID_ARGUMENT if no ID is supplied, and NOT_FOUND if the
  // customer does not exist.
  rpc GetCustomer (GetCustomerRequest) returns (Customer);
}

message GetCustomerRequest {
  string customer_id = 1;
}

message Customer {
  string customer_id = 1;
  string name = 2;
  string email = 3;
  string address = 4;
}
