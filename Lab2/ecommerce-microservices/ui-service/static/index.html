<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ecom Microservices Store</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
        <path d="M3 6h18"></path>
        <path d="M16 10a4 4 0 0 1-8 0"></path>
      </svg>
      <span>Ecom Microservices Store</span>
    </div>
    <div class="customer-field">
      <label for="customer-id">Customer ID</label>
      <input id="customer-id" type="text" placeholder="e.g. C001" />
    </div>
  </header>

  <main class="content">

    <section class="card lookup-card">
      <header class="card-header">
        <h2>Find a Product by ID</h2>
        <p class="subtitle">Look up any product ID directly through the Gateway</p>
      </header>
      <form id="lookup-form" class="lookup-form" autocomplete="off">
        <div class="input-row">
          <input id="product-id" name="id" type="text" placeholder="e.g. P001 or an ID that doesn't exist" />
          <button type="submit" id="lookup-btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Search</span>
          </button>
        </div>
      </form>
      <section id="lookup-result" class="result" aria-live="polite"></section>
    </section>

    <section class="catalog">
      <h2>Shop</h2>
      <p class="subtitle">Browse the catalogue and place an order directly from a product card</p>
      <div id="product-grid" class="product-grid" aria-live="polite"></div>
    </section>

  </main>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
